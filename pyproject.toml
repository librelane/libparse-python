[build-system]
requires = [
    "setuptools>=42",
    "pybind11>=2.10.0",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
extend-exclude = ["yosys"]

[tool.ruff.lint]
extend-select = ["I", "E", "PL"]
extend-ignore = ["PLR", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["PLC0415"]
